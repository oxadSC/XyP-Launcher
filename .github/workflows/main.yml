name: Build XyP Launcher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android Platform
        run: npx cap add android

      - name: Patch Android Project
        run: node scripts/patch-android.mjs || echo "No patch script found, skipping"

      - name: Sync Web Code to Native
        run: npx cap sync android

      - name: Build Android App (Debug APK)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xyp-launcher-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
